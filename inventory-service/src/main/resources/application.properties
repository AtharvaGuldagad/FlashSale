spring.application.name=inventory-service
# Server
server.port=8081

# H2 Database (Inventory DB)
spring.datasource.url=jdbc:h2:mem:inventorydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Kafka Setup
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory-group

# Consumer properties Kafka(Catching the ball)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# To avoid spring crash disable type headers
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.atharva.flashsale.inventory_service.event.OrderCreatedEvent

# Producer properties Kafka(Throwing the next ball)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
